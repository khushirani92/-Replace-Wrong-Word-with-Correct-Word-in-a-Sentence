<!DOCTYPE html>
<html>
<head>
  <title>Correct Word Replacer</title>

  <style>
    body {
      font-family: Arial;
      background: linear-gradient(to right, #6a0dad, #ffffff);
      padding: 20px;
      margin: 0;
    }

    h1 {
      text-align: center;
      color: white;
      margin-bottom: 20px;
    }

    .box {
      background: rgba(255, 255, 255, 0.9);
      padding: 20px;
      margin: 10px auto;
      border-radius: 15px;
      width: 350px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    input {
      padding: 10px;
      margin: 8px 0;
      width: 95%;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    button {
      padding: 10px;
      width: 100%;
      background: #6a0dad;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #4b0082;
    }

    h3 {
      color: #6a0dad;
    }

    #output {
      font-weight: bold;
      color: #333;
    }
  </style>
</head>

<body>

  <h1>Sentence Word Corrector</h1>

  <div class="box">
    <input id="sentence" placeholder="Enter sentence">
    <input id="wrong" placeholder="Wrong word">
    <input id="correct" placeholder="Correct word">

    <button onclick="fixSentence()">Fix Sentence</button>
  </div>

  <div class="box">
    <h3>Output:</h3>
    <p id="output"></p>
  </div>

  <script>
    function correctfn(string, wrong, correct) {
      return string.replace(wrong, correct);
    }

    function fixSentence() {
      let sentence = document.getElementById("sentence").value;
      let wrong = document.getElementById("wrong").value;
      let correct = document.getElementById("correct").value;

      let result = correctfn(sentence, wrong, correct);

      document.getElementById("output").innerText = result;
    }
  </script>

</body>
</html>
